name: 'Notify on external PR'

# Requests a review from a maintainer whenever someone opens a pull request from
# a fork, so that external contributions are never missed. This fires
# immediately, before and regardless of whether any CI check runs -- a PR whose
# checks fail, or whose checks never run at all, still produces a notification.
#
# Copybara's export PRs are deliberately excluded. Those are opened from
# `test_<CL>` branches inside this repository rather than from a fork, and the
# corresponding changelist already notifies internally.

on:
  # This must be `pull_request_target` rather than `pull_request`, since
  # `pull_request` can be held behind GitHub's first-time-contributor approval gate
  pull_request_target:
    # `reopened` matters: reopening is how a stuck pull request gets retried.
    types: ['opened', 'reopened']

# Default to no permissions
permissions: {}

jobs:
  notify:
    # Only fork pull requests, i.e. genuine external contributions.
    if: github.event.pull_request.head.repo.fork
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: 'Request review from a maintainer'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          REPO: '${{ github.repository }}'
        run: |
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-reviewer 'kevin-j-miller'

      # Only on `opened`, so that reopening a pull request does not post a
      # second copy of the same note.
      - name: 'Post a welcome note'
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          REPO: '${{ github.repository }}'
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file - <<'EOF'
          Thanks for contributing to disentangled_rnns! A maintainer has been
          notified and will take a look. Two things that may save you time:

          **Sign the Google CLA** at https://cla.developers.google.com/ if you
          have not already. The `cla/google` check has to be green before this
          can be merged, and it is the most common reason a pull request stalls
          here.

          **How review works.** This repository is a mirror. The source of truth
          for the code lives in Google's internal repository, so once CI and the
          CLA check pass, your pull request is imported there automatically and
          reviewed internally. Review comments may therefore arrive in a batch
          rather than one at a time, and when the change lands it will show up
          here as a single squashed commit rather than your original one. You
          will still be credited as the author.
          EOF

